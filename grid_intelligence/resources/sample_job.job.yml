resources:
  jobs:
    sample_job:
      name: grid_intelligence_medalhao
      max_concurrent_runs: 1

      parameters:
        - name: regiao
          default: Campinas
        - name: usar_ia
          default: "false"

      tasks:
        - task_key: remover_mascara_dado_pessoal
          sql_task:
            file:
              path: ../src/sql/remover_mascara_dado_pessoal.sql
              source: WORKSPACE
            parameters:
              catalogo: ${var.catalog}
              schema_bronze: ${resources.schemas.bronze.name}
            warehouse_id: ${var.warehouse_id}

        - task_key: pipeline_medalhao
          depends_on:
            - task_key: remover_mascara_dado_pessoal
          pipeline_task:
            pipeline_id: ${resources.pipelines.grid_bronze.id}
            full_refresh: true

        - task_key: metric_view_continuidade
          depends_on:
            - task_key: pipeline_medalhao
          sql_task:
            file:
              path: ../src/sql/metric_view_continuidade.sql
              source: WORKSPACE
            parameters:
              catalogo: ${var.catalog}
              schema_gold: ${resources.schemas.gold.name}
            warehouse_id: ${var.warehouse_id}

        - task_key: governanca_dado_pessoal
          depends_on:
            - task_key: pipeline_medalhao
          sql_task:
            file:
              path: ../src/sql/governanca_dado_pessoal.sql
              source: WORKSPACE
            parameters:
              catalogo: ${var.catalog}
              schema_bronze: ${resources.schemas.bronze.name}
            warehouse_id: ${var.warehouse_id}

        - task_key: relatorio_executivo
          depends_on:
            - task_key: metric_view_continuidade
            - task_key: governanca_dado_pessoal
          notebook_task:
            notebook_path: ../src/notebooks/relatorio_executivo.py
            source: WORKSPACE
            base_parameters:
              catalogo: ${var.catalog}
              schema_gold: ${resources.schemas.gold.name}
              regiao: "{{job.parameters.regiao}}"
              usar_ia: "{{job.parameters.usar_ia}}"
