# This is a Databricks asset bundle definition for grid_intelligence.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: grid_intelligence
  uuid: 8413eddf-a82e-4685-a133-9b761e18fc0a

experimental:
  skip_name_prefix_for_schema: true

include:
  - resources/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  warehouse_id:
    description: SQL warehouse used by the metric view and governance tasks

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-7a6349ec-d685.cloud.databricks.com
    variables:
      catalog: grid_dev
      warehouse_id: 8561dbb0dd49340a
  prod:
    mode: production
    workspace:
      host: https://dbc-7a6349ec-d685.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/santannajp@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/santannajp@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: grid_intelligence
      warehouse_id: 8561dbb0dd49340a
    permissions:
      - user_name: santannajp@gmail.com
        level: CAN_MANAGE
